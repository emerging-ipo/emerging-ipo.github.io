name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 台灣時間 16:10，週一～週五：快速更新
    - cron: "10 8 * * 1-5"
    # 台灣時間 17:40，週一～週五：正式盤後更新
    - cron: "40 9 * * 1-5"
    # 台灣時間 10:00，週六：星期五資料最終校正
    - cron: "0 2 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Record refresh trigger
        env:
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
        run: |
          printf 'Trigger: %s\nSchedule: %s\n' "$GITHUB_EVENT_NAME" "$REFRESH_SCHEDULE"
          date --utc --iso-8601=seconds
          TZ=Asia/Taipei date --iso-8601=seconds
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --use-system-ca
          NODE_EXTRA_CA_CERTS: certs/twca-tpex-ca.pem
          CURL_CA_BUNDLE: certs/twca-tpex-ca.pem
      - name: Verify generated data
        run: npm run verify:data
        env:
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
      - name: Preserve official last-trade history
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- public/data/tpex-last-trade-history.json; then
            echo "Official last-trade history is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tpex-last-trade-history.json
          git commit -m "data: preserve official last-trade history"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
