name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 台灣時間 16:10，週一～週五：快速更新
    - cron: "10 8 * * 1-5"
    # 台灣時間 17:40，週一～週五：正式盤後更新
    - cron: "40 9 * * 1-5"
    # 台灣時間 18:10，週一～週五：排程延遲時的盤後補抓
    - cron: "10 10 * * 1-5"
    # 台灣時間 10:00，週六：星期五資料最終校正
    - cron: "0 2 * * 6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
